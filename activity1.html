<!DOCTYPE html>
<html lang="en">
   <head>
    <title>My playlist sorter</title>
  
   <style>
   body{background: lavender;}
   h1 ,h3{color: darkviolet;}
   .box{background white; color dark violet;}
</style>
   </head>
   <body>
    <div class="container py-4">
        <h1 class="mb-1">My playlist sorter</h1>
        <p class="text-muted mb-4"></p>
        <!-- TOPIC 1 & 2: sort() and reverse() -->
<div class="card mb-4">
    <div class="card-body">
        <h3 class="card-title">Song Names</h3>

        <button class="btn btn-primary m-2" onclick="sortAZ()">
            Sort A to Z
        </button>

        <button class="btn btn-primary" onclick="sortZA()">
            Sort Z to A
        </button>

        <div id="nameResult" class="box p-3 mt-3 rounded"></div>
    </div>
</div>

<!-- TOPIC 3: sort() with compare function -->
<div class="card mb-4">
    <div class="card-body">
        <h3 class="card-title">Sort Numbers</h3>
    </div>
</div>
    </div>
   </body>

   </head>
